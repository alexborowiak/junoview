
<div class="deck" id="deck" hidden>
  <div class="deck-top">
    <!-- no "Docs" button: getting back to the document view is already a
         button on the presentations rail, and one redundant control was
         holding a whole row open (2026-08-07) -->
    <!-- DOCUMENT-level chrome lives up here, not in the ribbon below:
         File, Save, undo/redo and the save readout are about the
         presentation as a whole, they never change with what you have
         selected, and you touch them a handful of times a session. The
         ribbon underneath is only for editing tools you use constantly.
         Mixing the two is what made the toolbar hard to read
         (2026-08-07). -->
    <!-- PRESENTING only. While editing, this bar is hidden and the way
         back is the presentations rail's own Notebooks button, which is
         on screen the whole time — so a second one in the ribbon was a
         group's worth of width spent on a journey already offered
         (2026-08-17, user: "remove the 'close the editor' button, that is
         not needed, people just click on the back to notebooks").
         It stays here because PRESENTING has no ribbon and no rail: full
         screen, the way out has to be visible or it does not exist. It
         also has to SAY where it goes — a bare "Back" beside an armed
         drawing tool looks like the way out of that tool, and it is not:
         Cancel is. -->
    <button class="dbtn" id="deck-exit"
      title="Leave the editor. Nothing is closed or lost.">&#8617;
      Close the editor</button>
    <span class="deck-topslot" id="deck-topslot"></span>
    <!-- what you are editing. Without it the bar was a handful of buttons
         with a void beside them and read as floating chrome rather than
         the document's own bar (2026-08-07, user). -->
    <span class="deck-title" id="deck-title"></span>
    <span class="deck-spring"></span>
    <!-- Present is a VIEW of the document, not an editing tool, so it
         sits with the document controls — top right, out of the way of
         the things you are actually clicking while you lay a page out -->
    <span class="deck-topright" id="deck-topright"></span>
  </div>
  <!-- the left COLUMN is the notebooks content and then the thumbnails,
       and nothing else. File / Save / undo / redo used to sit between
       them; they are document controls and now live in the thin bar
       across the top, which is where a document's controls go
       (2026-08-20, user: "horrible spot for the back and forewards
       button"). The column keeps its 2026-08-19 shape otherwise: the
       notebook content at the top, thumbnails filling the rest. -->
  <!-- ONE THIN BAR ACROSS THE TOP, the way PowerPoint puts the document's
       own controls above its tabs. Everything here is about the
       PRESENTATION rather than about what you have selected: open it,
       save it, step back through it, find something in it, see how big it
       is, play it. None of it changes when you click a shape, so none of
       it belongs in the ribbon underneath (2026-08-20, user: "there
       should be a small thin ribbon across the top, like on powerpoint,
       that has file, save, back forwards, zoom, presentation name,
       autosave frequency, search etc. Then the main things below it").
       It also settles two complaints in the same move: undo/redo were
       stranded in the left column under Save ("horrible spot for the back
       and forewards button"), and the column is now nothing but the
       notebook content and the thumbnails. -->
  <div class="deck-qat" id="deck-qat" hidden>
    <!-- File OVER Save, one cell two rows deep, the way PowerPoint
         stacks the small controls beside Paste (2026-08-17, user: "the
         save could go below the file"). Stacking them halves the
         group's width, and they are the two halves of the same
         errand. The wrapper stays a plain row inside the builder
         panel's header, which is a one-line bar. -->
    <span class="rbn-stack">
    <div class="dc-menuwrap">
      <button class="dbtn" id="dc-file" aria-haspopup="true"
        aria-expanded="false">File &#9662;</button>
      <div class="dc-menu" id="dc-menu" hidden>
        <button class="dc-mi" id="mi-new">New presentation</button>
        <button class="dc-mi" id="mi-rename">Rename&#8230;</button>
        <div class="dc-msep"></div>
        <button class="dc-mi" id="mi-auto-figs">Auto-build: figures</button>
        <button class="dc-mi" id="mi-auto-figdocs">Auto-build: figures + docs</button>
        <div class="dc-msep"></div>
        <button class="dc-mi" id="mi-nums">Slide numbers: off</button>
        <button class="dc-mi" id="mi-crop"
          title="Add trim marks just outside the page for the print
 shop to cut to. The page itself keeps its exact size &mdash; the sheet
 grows by 5mm on every side to hold them">Crop marks: off</button>
        <div class="dc-mi dc-pagebg" id="mi-pagebg"
          title="The page's own background. A slide can override it from
 Design &#9656; Background">Page background
        </div>
        <div class="dc-msep"></div>
        <button class="dc-mi" id="mi-save">Save to notebook&#8230;</button>
        <button class="dc-mi" id="mi-autosave" hidden></button>
        <button class="dc-mi" id="mi-pdf"
          title="Save as PDF at the page's TRUE size — an A0 poster
 exports as a real 841&#215;1189mm page, ready for the print shop">Export
 PDF / print&#8230;</button>
        <button class="dc-mi" id="mi-pptx"
          title="Save as a PowerPoint .pptx. Text stays editable and
 figures come across as pictures; a placed cell showing code or a table
 cannot convert — use PDF for those">Export PowerPoint
 (.pptx)&#8230;</button>
        <button class="dc-mi" id="mi-html"
          title="A single .html file anyone can open — no Junoview
 needed. Arrow keys page through it; Ctrl+P prints at page size">Export
 standalone HTML</button>
        <button class="dc-mi" id="mi-dl">Download a copy
          (.junoview)</button>
        <button class="dc-mi" id="mi-load">Open a .junoview
          file&#8230;</button>
        <button class="dc-mi" id="mi-discard">Discard changes</button>
        <button class="dc-mi" id="mi-del">Delete presentation</button>
      </div>
    </div>
    <!-- ONE control, not two. "Save" beside "→ This project ▾" read as
         two competing save buttons and nobody could tell what the
         second one did (2026-08-07, user: "even I am confused"). It is
         now a split button: press Save to save, press the chevron to
         choose where. The destination lives in the menu, which is
         where a destination belongs. -->
    <span class="dc-savegrp">
      <button class="dbtn" id="dc-save">Save</button>
      <span class="dc-menuwrap">
        <button class="dbtn dc-target" id="dc-target"
          aria-haspopup="true" aria-expanded="false"
          aria-label="Choose where this is saved"
          title="Choose where this is saved">&#9662;</button>
        <div class="dc-menu" id="target-menu" hidden>
          <div class="dc-mhead" id="tg-head">save to</div>
        <button class="dc-mi" id="tg-project" hidden>This project</button>
        <button class="dc-mi" id="tg-browser">This browser</button>
        <button class="dc-mi" id="tg-file">A file on your
          computer&#8230;</button>
        <div class="dc-msep"></div>
          <button class="dc-mi" id="tg-pick" hidden>Choose a different
            file&#8230;</button>
        </div>
      </span>
    </span>
    </span>
    <!-- ONE cell, like the zoom stepper: undo and redo are the same
         decision in two directions and must never end up on different
         lines. In the side rail's wrapping flow they did exactly that
         — undo closed one line and redo opened the next, alone and
         stretched the full width of the rail (2026-08-16). -->
    <span class="rbn-cell">
      <button class="dbtn dc-icon" id="dc-undo" disabled
        title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
      <button class="dbtn dc-icon" id="dc-redo" disabled
        title="Redo (Ctrl+Shift+Z)" aria-label="Redo">&#8631;</button>
    </span>
    <span class="qat-sep"></span>
    <!-- Find is a document-wide action, so it lives with the document
         controls rather than in a formatting group -->
    <button class="dbtn qat-btn" id="qat-find"
      title="Find and replace text anywhere in this presentation
 (Ctrl+F)">&#9906; Find</button>
    <span class="deck-spring"></span>
    <!-- the presentation's NAME, in the middle, where a title bar puts it.
         Click it to rename — the old rename lived in a File-menu item that
         un-hid an input inside a display:none block. -->
    <button class="qat-name" id="qat-name"
      title="Click to rename this presentation"></button>
    <input class="qat-nameedit" id="qat-nameedit" type="text" hidden
      spellcheck="false" autocomplete="off" aria-label="Presentation name">
    <span class="deck-spring"></span>
    <span class="deck-status" id="deck-status"></span>
    <!-- how often it saves itself, said out loud rather than buried as a
         File-menu toggle you had to open the menu to read -->
    <button class="dbtn qat-btn" id="qat-auto" hidden
      aria-haspopup="true"></button>
    <span class="qat-sep"></span>
    <!-- Zoom is a property of the VIEW, not of the page, and you reach for
         it constantly whatever tab you are on — so it sits up here where
         no tab can take it away -->
    <span class="rbn-cell qat-zoom">
      <button class="dbtn rbn-ico" id="zoom-out"
        title="Zoom out">&#8722;</button>
      <button class="dbtn rbn-sm" id="zoom-val"
        title="Click to fit the whole page in the window">Zoom 100%</button>
      <button class="dbtn rbn-ico" id="zoom-in" title="Zoom in">+</button>
    </span>
    <span class="qat-sep"></span>
    <!-- The APP controls, the same three the document view's App group
         carries, and WORDED like everything else. They were two bare
         glyphs (a ring and a heart) tucked at the end of the ribbon,
         which is the icon-only button this project has rejected twice —
         you could not tell what either one was, so the theme picker
         might as well not have existed (2026-08-20, user: "the themes and
         stuff need to go into this top bar as well"). Help is new here:
         editing hides the app bar, so from inside a poster there was no
         way to reach it at all. -->
    <span class="dc-menuwrap">
      <button class="dbtn qat-btn" id="deck-scheme" aria-haspopup="true"
        title="Colour scheme — dark, light, forest, colourful, high
 contrast"><i data-ic="palette"></i> Theme &#9662;</button>
    </span>
    <button class="dbtn qat-btn" id="deck-help"
      title="How to use this, and everything it can do (?)"
      aria-label="Help"><i data-ic="help"></i> Help</button>
    <a class="dbtn qat-btn" id="deck-support" target="_blank" rel="noopener"
      title="Support Junoview on Ko-fi — funds an online, hosted version
 with accounts"><i data-ic="heart"></i></a>
    <button class="dbtn primary qat-play" id="dc-play"
      title="Play this full screen, from this page (F5)">
      <i data-ic="play"></i> Present</button>
  </div>
  <aside class="deck-create" id="deck-create" hidden>
      <div class="dc-resize" id="dc-resize"
        title="Drag to resize the builder panel"></div>
      <!-- not a back button: the CONTENT of the notebooks pane — every
           notebook this presentation uses, with open/refresh — lives at
           the top of the column; the header row is the way back -->
      <div class="dc-nbs" id="dc-nbs"></div>
      <!-- the NAME lives outside .dc-controls: that block is display:none
           while editing, so File → Rename… un-hid an input inside a hidden
           ancestor — 0x0, unfocusable, "renaming doesn't work" in the
           primary flow (2026-08-20 diagnosis). Both children stay [hidden]
           except during an active rename, so the row costs no height. -->
      <div class="dc-block dc-name">
        <div class="dc-presname" id="pres-current" hidden></div>
        <input id="pres-name" type="text" placeholder="presentation name"
          spellcheck="false" autocomplete="off" hidden>
      </div>
      <div class="dc-block dc-controls">
        <button class="dbtn" id="dc-edit"
          title="Swap to the slide editor — add text, arrows and boxes">
          &#9998; Swap to edit view</button>
        <div class="lay-picker" id="layout-row"
          aria-label="Slide layouts"></div>
        <div class="title-editor" id="title-editor" hidden>
          <input id="ts-title" type="text" placeholder="Slide title"
            spellcheck="false" autocomplete="off">
          <input id="ts-sub" type="text" placeholder="Subtitle (optional)"
            spellcheck="false" autocomplete="off">
        </div>
      </div>
      <div class="dc-block dc-film">
        <div class="film-list" id="film-list"></div>
        <button class="dbtn addslide" id="film-add">+ Add slide</button>
      </div>
    </aside>
  <!-- The ribbon spans the WHOLE window, like the document view's app
       bar — it used to live inside the stage column, so the slide strip
       and rail came out of its width on every screen (2026-08-19, user:
       "the ribbon needs to go all the way across the top ... then this
       gives more space to the ribbon and all the options"). -->
  <!-- TABS. One ribbon could not hold what this editor now does — every
       new feature made the row denser until the density ladder was doing
       all the work and nothing had room to breathe (2026-08-20, user:
       "there might not need to be tabs like power point and foxit pdf
       has"). A tab shows one job's worth of groups at a time, so the
       groups that ARE showing can be full size.
       The strip is deliberately the same height as a button row and
       carries no second copy of anything: it is a chooser, not chrome.
       #rbn-tab-home is first and is where everything selection-driven
       lives, so the tools for the thing you just clicked are always one
       named place, never a tab that appears and vanishes under you. -->
  <div class="rbn-tabs" id="rbn-tabs" role="tablist" hidden>
    <!-- HOME also carries View and Output now. Guides, Layers, Print
         check and the object list are things you reach for constantly and
         WHILE something is selected, so a tab of their own meant leaving
         the tools you were using to get to them (2026-08-20, user: "View
         can just be back on home"). -->
    <button class="rbn-tab" id="rbn-tab-home" role="tab" data-tab="home"
      aria-selected="true"
      title="Everything that formats what you have selected, plus guides,
 layers and the print check">Home</button>
    <!-- Animate lives on this tab too. On its own it was one group of
         six small buttons under a whole tab of its own, and Insert had
         room to spare — two half-empty tabs read worse than one full one
         (2026-08-20, user: "some of those tabs have nothing on them now.
         Insert and animate can be one the one"). They also belong
         together: both are about putting something on the page and
         deciding how it arrives. -->
    <button class="rbn-tab" id="rbn-tab-insert" role="tab" data-tab="insert"
      aria-selected="false"
      title="Put something new on the page, and how it appears during
 playback">Insert</button>
    <button class="rbn-tab" id="rbn-tab-design" role="tab" data-tab="design"
      aria-selected="false"
      title="How the page itself looks — its size, layout and
 background">Design</button>
    <span class="deck-spring"></span>
    <span class="et-hint" id="et-hint"></span>
  </div>
  <div class="edit-tools ribbon" id="edit-tools" hidden>
        <!-- the app buttons the editor was hiding: the theme toggle and
             support live in the app bar, and editing hides the app bar —
             so from inside a poster there was no way to reach either
             (2026-08-18, user). At the very END of the bar: nothing sits
             beyond them, so they can never move a control. -->
        <div class="rbn-static">
          <!-- The document actions live HERE while editing, not in a bar
               of their own above the ribbon: a second row of chrome over
               the editing tools is a second row stolen from the page
               (2026-08-10, user: "I hate having the file, save, saved,
               button above the customisation buttons"). They are moved in
               at edit time and moved back out again, so the builder and
               Present keep their own arrangement.
               The label stays the fixed word "File" rather than the
               document's name: a group label sizes its group, so a long
               name would make the ribbon's width depend on what you
               happened to call the file. Present is DOWN here too — it is
               a way of viewing the page, so it belongs with the other
               view controls (2026-08-07, user). -->
          <!-- no File group and no Notebooks group. File / Save / undo /
               redo / the save readout are the document's own controls and
               live in the thin bar above; the notebooks a presentation is
               built from are the whole top of the left column, which is
               on screen the entire time. A ribbon button that opened a
               second copy of that list in a floating pane was a group's
               worth of width spent on something already showing
               (2026-08-20, user: "so the notebook button can be removed
               now. Haven't we put all the functionality on the left hand
               side?"). -->
          <span class="rbn-grp rbn-fixed rbn-slide" data-tab="design">
            <span class="rbn-row">
              <span class="sh-drop" id="lay-drop">
                <button class="dbtn rbn-sm" id="lay-btn"
                  aria-haspopup="true" aria-expanded="false"
                  title="Ready-made arrangements for this page &mdash;
 columns, a hero figure, title layouts"><i data-ic="layouts"></i>
 Layouts &#9662;</button>
                <div class="sh-menu lay-menu" id="lay-menu" hidden>
                  <div class="lay-picker" id="layout-menu-grid"
                    aria-label="Slide layouts"></div>
                </div>
              </span>
              <span class="sh-drop" id="page-drop">
                <button class="dbtn rbn-sm" id="page-btn"
                  aria-haspopup="true" aria-expanded="false"
                  title="How big the page is &mdash; slides (16:9, 4:3)
 or a poster (A4&ndash;A0, portrait or landscape)"><i data-ic="pagep"></i>
 Page size &#9662;</button>
                <div class="sh-menu page-menu" id="page-menu" hidden></div>
              </span>
              <span class="sh-drop" id="bg-drop">
                <button class="dbtn rbn-sm" id="bg-btn"
                  aria-haspopup="true" aria-expanded="false"
                  title="THIS slide's background colour and border. The
 whole presentation's background lives under File"
                  >&#9703; Background &#9662;</button>
                <div class="sh-menu bg-menu" id="bg-menu" hidden></div>
              </span>
              <!-- The strip listing the OTHER pages belongs with the page
                   controls, not under View: it is the set this page is one
                   of, which is exactly what Layouts and Page size are
                   about (2026-08-17, user: "the view and slide is very
                   confused ... the 'Slides' is slide?"). A poster's other
                   pages are versions, so the label follows the page kind,
                   and the group heading follows it too — SLIDE for a deck,
                   PAGE for a poster. -->
              <button class="dbtn rbn-sm" id="vw-versions"
                aria-pressed="false" hidden
                title="Other versions of this poster — drafts and variants.
 Opens the strip; close it again to give the page the whole window"
                >&#9776; Versions</button>
            </span>
            <span class="rbn-lab">Slide</span>
          </span>
          <!-- PAGE FURNITURE. A watermark, a header and a footer are one
               piece of content repeated on every page, which is exactly
               what slide numbers already were - so they live together,
               under Design, and not as items you could drag off the page
               by accident (2026-08-20). -->
          <span class="rbn-grp rbn-furn" data-tab="design">
            <span class="rbn-row">
              <button class="dbtn rbn-sm" id="dc-wmark"
                aria-pressed="false"
                title="A word across every page - DRAFT, CONFIDENTIAL, your
 name. Sits behind the content, never over it">&#9639; Watermark</button>
              <button class="dbtn rbn-sm" id="dc-head"
                aria-pressed="false"
                title="A line along the top of every page">&#9776;
 Header</button>
              <button class="dbtn rbn-sm" id="dc-foot"
                aria-pressed="false"
                title="A line along the bottom of every page. Use {n} and
 {N} for the page number and the total">&#9776; Footer</button>
              <button class="dbtn rbn-sm" id="dc-nums"
                aria-pressed="false"
                title="Number every page">&#8470; Numbers</button>
            </span>
            <span class="rbn-lab">Page furniture</span>
          </span>
          <!-- TWO groups, not one. Guides and Objects change what YOU see
               while working; Print check and Present are about the
               finished thing, on paper or on a screen. They were lumped
               together under "View", which described only half of them
               (2026-08-07, user: "present and print check go together,
               but objects and guides are different"). Both sit last —
               right in the horizontal bar, bottom in the side one. -->
          <!-- NOT a standby group. It holds zoom now, and you zoom
               constantly with something selected — the same reason File
               and Slide have always stayed through a selection. Guides
               and Objects earn the seat too: an object list is at its most
               useful when you have an object selected (2026-08-17). -->
          <span class="rbn-grp rbn-fixed rbn-view" data-tab="home">
            <span class="rbn-row">
              <!-- four toggles behind one worded menu. Every option keeps
                   its full name inside; what the row loses is width, not
                   words. -->
              <span class="sh-drop" id="vw-menuwrap">
                <button class="dbtn rbn-sm" id="vw-menu"
                  aria-haspopup="true" aria-expanded="false"
                  title="Rulers, grid, where this toolbar sits, and
 full-screen editing">&#9707; Guides &#9662;</button>
                <div class="sh-menu vw-menu" id="vw-menu-list" hidden>
                  <button class="dbtn vw-opt" id="vw-rulers"
                    aria-pressed="false"
                    title="Rulers down the top and left edge, in millimetres
 of the real page. Drag off one to lay down your own guide"
                    >&#128207; Rulers <kbd>R</kbd></button>
                  <button class="dbtn vw-opt" id="vw-grid"
                    aria-pressed="false"
                    title="A margin box and a grid to lay out against
 &mdash; items snap to both. Guides, not ink: never printed or
 exported">&#9638; Margin &amp; grid <kbd>G</kbd></button>
                  <button class="dbtn vw-opt" id="vw-side"
                    aria-pressed="false"
                    title="Stand the toolbar up on the right-hand edge, so
 the page gets the full height of the window. A tall poster needs height
 far more than width"
                    >&#8942; Toolbar on the right</button>
                  <button class="dbtn vw-opt" id="vw-full"
                    title="Edit full screen &mdash; the browser chrome goes
 away and the page gets the whole display (Esc to leave). Unlike Present,
 you keep every editing tool">&#10530; Edit full screen</button>
                </div>
              </span>
              <!-- Layers is a panel you show or hide — a way of LOOKING
                   at the page, not a property of it. Called Layers, not
                   Objects: the standard name for this list everywhere
                   else (2026-08-19, user) -->
              <button class="dbtn rbn-sm" id="objects-btn"
                aria-pressed="false"
                title="List everything on this page, and hide or lock any
 of it"><i data-ic="objects"></i> Layers</button>
              <!-- Zoom has left this group for the thin bar at the top.
                   It is the one control you reach for on EVERY tab, and a
                   control that a tab can take away from you is a control
                   you cannot rely on (2026-08-20). The animation pane has
                   gone the other way, into its own tab, with the effects
                   beside it. -->
            </span>
            <span class="rbn-lab">View</span>
          </span>
          <span class="rbn-grp rbn-out" data-tab="home">
            <span class="rbn-row">
              <!-- "Check" alone said nothing (2026-08-07, user: "what are
                   things like 'check', what does that even mean?"). The
                   label has to name what is being checked. -->
              <button class="dbtn rbn-sm" id="vw-check"
                aria-pressed="false"
                title="Check this page before it goes to print: soft
 figures, anything off the page or inside the margin, unreadable text,
 empty frames">&#9873; Print check</button>
            </span>
            <span class="rbn-lab">Output</span>
          </span>
          <!-- ANIMATE. The pane and the effect chooser are the same job
               and now sit in the same tab instead of the pane hiding
               under View. The effect buttons act on the selection, so
               they are hidden without one — the pane is not, because a
               build order is a property of the SLIDE. -->
          <span class="rbn-grp rbn-anim" data-tab="insert">
            <span class="rbn-row">
              <button class="dbtn rbn-sm" id="vw-anim"
                aria-pressed="false"
                title="Everything animated on this slide, in the order it
 appears — and the effect on whatever is selected"
                >&#9654; Animation pane</button>
              <button class="dbtn etm" id="anim-none" hidden
                title="Remove the animation from the selected items — they
 are simply on the slide from the start">&#8709; None</button>
              <button class="dbtn etm" id="anim-fade" hidden
                title="Fade the selected items in">Fade</button>
              <button class="dbtn etm" id="anim-rise" hidden
                title="Rise the selected items in from below">Rise</button>
              <button class="dbtn etm" id="anim-zoom" hidden
                title="Zoom the selected items in">Zoom</button>
              <button class="dbtn rbn-sm dbtn-warn" id="anim-clear"
                title="Remove EVERY animation on this slide — nothing is
 held back during playback">&#10005; Clear slide</button>
            </span>
            <span class="rbn-lab">Animate</span>
          </span>
          <span class="rbn-grp rbn-insert" data-tab="insert">
            <span class="rbn-row">
              <!-- All one size. Three big buttons here were the worst of
                   the "so many sizes" problem (2026-08-07): nothing shared
                   a baseline and no size meant anything. Emphasis is
                   carried by COLOUR now — Present is the one accented
                   control — so every other button can be identical. -->
              <button class="dbtn et rbn-sm" data-tool="cell"
                aria-pressed="false"
                title="Place a figure, table or note from your notebook —
 you pick which one"><i data-ic="cellcard"></i> Notebook cell</button>

           look and behave the same (2026-08-10, user: "the bar for this
           should appear like the objects bar"). The strip itself is MOVED
           in here rather than rebuilt, so reordering, drag-and-drop,
           delete and the thumbnails all keep working. -->
      <!-- Animations, in the same shell as Objects and Versions: a list
           you open to look at the slide from outside it. Reachable with
           NOTHING selected, which is the whole point — the build order is
           a property of the slide, not of whatever you happen to have
           clicked. -->
      <aside class="selpane animpane" id="animpane" hidden>
        <div class="selpane-h"><span>Animation pane</span>
          <button class="dbtn dc-icon" id="animpane-close"
            title="Close">&#10005;</button></div>
        <div class="selpane-list" id="animpane-body"></div>
      </aside>
      <aside class="selpane verpane" id="verpane" hidden>
        <div class="selpane-h"><span id="verpane-title">Versions</span>
          <button class="dbtn dc-icon" id="verpane-close"
            title="Close">&#10005;</button></div>
        <div class="selpane-list" id="verpane-body"></div>
      </aside>
      <button class="deck-arrow prev" id="deck-prev"
        title="Previous slide (&#8592;)"
        aria-label="Previous slide">&#8249;</button>
      <!-- rulers overlay the stage rather than sitting in its flow: the
           slide must not move or resize when they are switched on -->
      <div class="rulers" id="rulers" hidden aria-hidden="true">
        <div class="ruler ruler-h" id="ruler-h"></div>
        <div class="ruler ruler-v" id="ruler-v"></div>
        <div class="ruler-corner" id="ruler-corner">mm</div>
      </div>
      <div class="deck-stage" id="deck-stage"></div>
      <button class="deck-arrow next" id="deck-next"
        title="Next slide (&#8594;)"
        aria-label="Next slide">&#8250;</button>
      <button class="deck-arrow up" id="deck-up" hidden
        title="Back to the slide (&#8593;)"
        aria-label="Back up to the slide">&#8593;</button>
      <button class="deck-codepill" id="deck-down" hidden
        title="Scroll down to the code trace (&#8595;)"
        aria-label="Show the code trace that made this slide">
        <span class="cp-arr">&#8595;</span> Show code</button>
      <span class="deck-count" id="deck-count"></span>
    </div>
  </div>
  <div class="vfull" id="vfull" hidden>
    <div class="vfull-head">
      <span class="chain-badge" id="vfull-badge"></span>
      <span class="vfull-t" id="vfull-t"></span>
      <button class="dbtn" id="vfull-close"
        title="Close (Esc)">&#10005; Close</button>
    </div>
    <div class="vfull-body" id="vfull-body"></div>
  </div>
  <div class="deck-toast" id="deck-toast" hidden></div>
</div>
<div class="pickbar" id="pickbar" hidden>
  <span>&#128204; Click a card in the notebook to place it in the
  slide</span>
  <span class="deck-spring"></span>
  <button class="dbtn" id="pick-cancel">Cancel (Esc)</button>
</div>
<!-- FIND AND REPLACE across the whole presentation. A panel rather than a
     browser find: what you are searching is the model (every text box,
     every slide title, every list item on every slide), not the one slide
     the browser happens to have rendered. Ctrl+F opens it, Enter walks the
     hits, and picking one goes to that slide and selects that item so you
     can see what you are about to change (2026-08-20, user: "needs to be a
     search and replace of text and stuff, that is pretty standard"). -->
<div class="find-pop" id="find-pop" hidden role="dialog"
  aria-label="Find and replace">
  <div class="find-head">
    <span class="find-t">Find &amp; replace</span>
    <button class="dbtn dc-icon" id="find-close"
      title="Close (Esc)">&#10005;</button>
  </div>
  <div class="find-row">
    <input type="text" id="find-q" class="find-in" spellcheck="false"
      autocomplete="off" placeholder="Find" aria-label="Find what">
    <button class="dbtn dc-icon" id="find-prev"
      title="Previous match (Shift+Enter)">&#8593;</button>
    <button class="dbtn dc-icon" id="find-next"
      title="Next match (Enter)">&#8595;</button>
  </div>
  <div class="find-row">
    <input type="text" id="find-r" class="find-in" spellcheck="false"
      autocomplete="off" placeholder="Replace with"
      aria-label="Replace with">
  </div>
  <div class="find-opts">
    <label class="find-ck"><input type="checkbox" id="find-case">
      Match case</label>
    <label class="find-ck"><input type="checkbox" id="find-word">
      Whole word</label>
  </div>
  <div class="find-foot">
    <span class="find-count" id="find-count"></span>
    <span class="deck-spring"></span>
    <button class="dbtn" id="find-rep">Replace</button>
    <button class="dbtn" id="find-repall">Replace all</button>
  </div>
  <div class="find-list" id="find-list"></div>
</div>
<div class="color-pop" id="color-pop" hidden>
  <div class="cp-head" id="cp-head">Custom colour</div>
  <input type="color" id="cp-native" class="cp-native" value="#39a9c0"
    aria-label="Pick a colour">
  <div class="cp-row">
    <span class="cp-lab">Hex</span>
    <input type="text" id="cp-hex" class="cp-in" spellcheck="false"
      autocomplete="off" placeholder="#39a9c0" maxlength="9">
  </div>
  <div class="cp-row">
    <span class="cp-lab">RGB</span>
    <input type="text" id="cp-rgb" class="cp-in" spellcheck="false"
      autocomplete="off" placeholder="rgba(57, 169, 192, 1)">
  </div>
  <div class="cp-row cp-arow">
    <span class="cp-lab">Alpha</span>
    <input type="range" id="cp-alpha" class="cp-alpha" min="0" max="100"
      step="1" value="100" aria-label="Opacity">
    <span class="cp-aval" id="cp-aval">100%</span>
  </div>
  <div class="cp-recent" id="cp-recent"></div>
  <div class="cp-foot">
    <span class="cp-preview" id="cp-preview"></span>
    <span class="deck-spring"></span>
    <button class="dbtn cp-apply" id="cp-apply">Apply</button>
  </div>
</div>
