
<div class="deck" id="deck" hidden>
  <div class="deck-top">
    <!-- no "Docs" button: getting back to the document view is already a
         button on the presentations rail, and one redundant control was
         holding a whole row open (2026-08-07) -->
    <!-- DOCUMENT-level chrome lives up here, not in the ribbon below:
         File, Save, undo/redo and the save readout are about the
         presentation as a whole, they never change with what you have
         selected, and you touch them a handful of times a session. The
         ribbon underneath is only for editing tools you use constantly.
         Mixing the two is what made the toolbar hard to read
         (2026-08-07). -->
    <span class="deck-topslot" id="deck-topslot"></span>
    <!-- what you are editing. Without it the bar was a handful of buttons
         with a void beside them and read as floating chrome rather than
         the document's own bar (2026-08-07, user). -->
    <span class="deck-title" id="deck-title"></span>
    <span class="deck-spring"></span>
    <!-- Present is a VIEW of the document, not an editing tool, so it
         sits with the document controls — top right, out of the way of
         the things you are actually clicking while you lay a page out -->
    <span class="deck-topright" id="deck-topright"></span>
    <button class="dbtn" id="deck-exit"
      title="Stop presenting and go back to the slide builder (Esc).
 Nothing is closed or lost.">&#8617; Back</button>
  </div>
  <div class="deck-main">
    <aside class="deck-create" id="deck-create" hidden>
      <div class="dc-resize" id="dc-resize"
        title="Drag to resize the builder panel"></div>
      <div class="dc-head">
        <div class="dc-menuwrap">
          <button class="dbtn" id="dc-file" aria-haspopup="true"
            aria-expanded="false">File &#9662;</button>
          <div class="dc-menu" id="dc-menu" hidden>
            <button class="dc-mi" id="mi-new">New presentation</button>
            <button class="dc-mi" id="mi-rename">Rename&#8230;</button>
            <div class="dc-msep"></div>
            <button class="dc-mi" id="mi-auto-figs">Auto-build: figures</button>
            <button class="dc-mi" id="mi-auto-figdocs">Auto-build: figures + docs</button>
            <div class="dc-msep"></div>
            <button class="dc-mi" id="mi-nums">Slide numbers: off</button>
            <button class="dc-mi" id="mi-crop"
              title="Add trim marks just outside the page for the print
 shop to cut to. The page itself keeps its exact size &mdash; the sheet
 grows by 5mm on every side to hold them">Crop marks: off</button>
            <div class="dc-mi dc-pagebg" id="mi-pagebg"
              title="The page's own background — pick white for a poster
 that goes to a print shop">Page background
              <span class="pgbg-sw" data-bg="#ffffff" title="White (print)"></span>
              <span class="pgbg-sw" data-bg="#f6f2ea" title="Cream"></span>
              <span class="pgbg-sw" data-bg="#eef1f4" title="Light grey"></span>
              <span class="pgbg-sw" data-bg="#0b141d" title="Dark (classic)"></span>
              <span class="pgbg-sw" data-bg="#000000" title="Black"></span>
            </div>
            <div class="dc-msep"></div>
            <button class="dc-mi" id="mi-save">Save to notebook&#8230;</button>
            <button class="dc-mi" id="mi-autosave" hidden></button>
            <button class="dc-mi" id="mi-pdf"
              title="Save as PDF at the page's TRUE size — an A0 poster
 exports as a real 841&#215;1189mm page, ready for the print shop">Export
 PDF / print&#8230;</button>
            <button class="dc-mi" id="mi-pptx"
              title="Save as a PowerPoint .pptx. Text stays editable and
 figures come across as pictures; a placed cell showing code or a table
 cannot convert — use PDF for those">Export PowerPoint
 (.pptx)&#8230;</button>
            <button class="dc-mi" id="mi-html"
              title="A single .html file anyone can open — no Junoview
 needed. Arrow keys page through it; Ctrl+P prints at page size">Export
 standalone HTML</button>
            <button class="dc-mi" id="mi-dl">Download a copy
              (.junoview)</button>
            <button class="dc-mi" id="mi-load">Open a .junoview
              file&#8230;</button>
            <button class="dc-mi" id="mi-discard">Discard changes</button>
            <button class="dc-mi" id="mi-del">Delete presentation</button>
          </div>
        </div>
        <!-- ONE control, not two. "Save" beside "→ This project ▾" read as
             two competing save buttons and nobody could tell what the
             second one did (2026-08-07, user: "even I am confused"). It is
             now a split button: press Save to save, press the chevron to
             choose where. The destination lives in the menu, which is
             where a destination belongs. -->
        <span class="dc-savegrp">
          <button class="dbtn" id="dc-save">Save</button>
          <span class="dc-menuwrap">
            <button class="dbtn dc-target" id="dc-target"
              aria-haspopup="true" aria-expanded="false"
              aria-label="Choose where this is saved"
              title="Choose where this is saved">&#9662;</button>
            <div class="dc-menu" id="target-menu" hidden>
              <div class="dc-mhead" id="tg-head">save to</div>
            <button class="dc-mi" id="tg-project" hidden>This project</button>
            <button class="dc-mi" id="tg-browser">This browser</button>
            <button class="dc-mi" id="tg-file">A file on your
              computer&#8230;</button>
            <div class="dc-msep"></div>
              <button class="dc-mi" id="tg-pick" hidden>Choose a different
                file&#8230;</button>
            </div>
          </span>
        </span>
        <button class="dbtn dc-icon" id="dc-undo" disabled
          title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
        <button class="dbtn dc-icon" id="dc-redo" disabled
          title="Redo (Ctrl+Shift+Z)" aria-label="Redo">&#8631;</button>
        <span class="dc-spring"></span>
        <span class="deck-status" id="deck-status"></span>
      </div>
      <div class="dc-block dc-controls">
        <div class="dc-presname" id="pres-current" hidden></div>
        <input id="pres-name" type="text" placeholder="presentation name"
          spellcheck="false" autocomplete="off" hidden>
        <button class="dbtn" id="dc-edit"
          title="Swap to the slide editor — add text, arrows and boxes">
          &#9998; Swap to edit view</button>
        <div class="lay-picker" id="layout-row"
          aria-label="Slide layouts"></div>
        <div class="title-editor" id="title-editor" hidden>
          <input id="ts-title" type="text" placeholder="Slide title"
            spellcheck="false" autocomplete="off">
          <input id="ts-sub" type="text" placeholder="Subtitle (optional)"
            spellcheck="false" autocomplete="off">
        </div>
      </div>
      <div class="dc-block dc-film">
        <div class="film-list" id="film-list"></div>
        <button class="dbtn addslide" id="film-add">+ Add slide</button>
      </div>
    </aside>
    <div class="deck-stagewrap" id="deck-stagewrap">
      <div class="edit-tools ribbon" id="edit-tools" hidden>
        <div class="rbn-static">
          <!-- No File group here: File, Save, undo/redo and the save
               readout are document actions and live in the top bar, where
               they do not compete with the editing tools. Present stays
               DOWN here though — it is a way of viewing the page, so it
               belongs with the other view controls (2026-08-07, user:
               "put the present with the view"). -->
          <span class="rbn-grp rbn-standby">
            <span class="rbn-row">
              <div class="dc-menuwrap">
                <!-- label is set by renderPresNbs (Open vs Refresh), so
                     no icon element here: textContent would delete it -->
                <button class="dbtn rbn-sm" id="dc-nbs-btn"
                  aria-haspopup="true" aria-expanded="false"
                  title="Notebooks that went into this presentation"
                  >Notebooks</button>
                <div class="dc-menu dc-nbs-menu" id="dc-nbs-menu" hidden></div>
              </div>
            </span>
            <span class="rbn-lab">Notebooks</span>
          </span>
          <span class="rbn-grp rbn-slide">
            <span class="rbn-row">
              <span class="sh-drop" id="lay-drop">
                <button class="dbtn rbn-sm" id="lay-btn"
                  aria-haspopup="true" aria-expanded="false"
                  title="Ready-made arrangements for this page &mdash;
 columns, a hero figure, title layouts"><i data-ic="layouts"></i>
 Layouts &#9662;</button>
                <div class="sh-menu lay-menu" id="lay-menu" hidden>
                  <div class="lay-picker" id="layout-menu-grid"
                    aria-label="Slide layouts"></div>
                </div>
              </span>
              <span class="sh-drop" id="page-drop">
                <button class="dbtn rbn-sm" id="page-btn"
                  aria-haspopup="true" aria-expanded="false"
                  title="How big the page is &mdash; slides (16:9, 4:3)
 or a poster (A4&ndash;A0, portrait or landscape)"><i data-ic="pagep"></i>
 Page size &#9662;</button>
                <div class="sh-menu page-menu" id="page-menu" hidden></div>
              </span>
              <!-- the three zoom controls are ONE cell: they are one
                   decision, and splitting them across the grid would put
                   the minus and the plus on different rows -->
              <span class="rbn-cell">
                <button class="dbtn rbn-ico" id="zoom-out"
                  title="Zoom out">&#8722;</button>
                <button class="dbtn rbn-sm" id="zoom-val"
                  title="Click to fit the whole page in the window"
                  >Zoom 100%</button>
                <button class="dbtn rbn-ico" id="zoom-in"
                  title="Zoom in">+</button>
              </span>
            </span>
            <span class="rbn-lab">Slide</span>
          </span>
          <!-- View sits at the FAR RIGHT of the ribbon (2026-08-07, user:
               "put the view box on the far right"), which CSS order does
               without moving it out of the static block -->
          <span class="rbn-grp rbn-standby rbn-view">
            <span class="rbn-row">
              <!-- "Check" alone said nothing (2026-08-07, user: "what are
                   things like 'check', what does that even mean?"). The
                   label has to name what is being checked. -->
              <button class="dbtn rbn-sm" id="vw-check"
                aria-pressed="false"
                title="Check this page before it goes to print: soft
 figures, anything off the page or inside the margin, unreadable text,
 empty frames">&#9873; Print check</button>
              <!-- four toggles behind one worded menu. Every option keeps
                   its full name inside; what the row loses is width, not
                   words. -->
              <span class="sh-drop" id="vw-menuwrap">
                <button class="dbtn rbn-sm" id="vw-menu"
                  aria-haspopup="true" aria-expanded="false"
                  title="Rulers, grid, where this toolbar sits, and
 full-screen editing">&#9707; Guides &#9662;</button>
                <div class="sh-menu vw-menu" id="vw-menu-list" hidden>
                  <button class="dbtn vw-opt" id="vw-rulers"
                    aria-pressed="false"
                    title="Rulers down the top and left edge, in millimetres
 of the real page. Drag off one to lay down your own guide"
                    >&#128207; Rulers <kbd>R</kbd></button>
                  <button class="dbtn vw-opt" id="vw-grid"
                    aria-pressed="false"
                    title="A margin box and a grid to lay out against
 &mdash; items snap to both. Guides, not ink: never printed or
 exported">&#9638; Margin &amp; grid <kbd>G</kbd></button>
                  <button class="dbtn vw-opt" id="vw-side"
                    aria-pressed="false"
                    title="Stand the toolbar up on the right-hand edge, so
 the page gets the full height of the window. A tall poster needs height
 far more than width"
                    >&#8942; Toolbar on the right</button>
                  <button class="dbtn vw-opt" id="vw-full"
                    title="Edit full screen &mdash; the browser chrome goes
 away and the page gets the whole display (Esc to leave). Unlike Present,
 you keep every editing tool">&#10530; Edit full screen</button>
                </div>
              </span>
              <!-- Objects is a panel you show or hide — a way of LOOKING
                   at the page, not a property of it — so it belongs here
                   rather than in Page -->
              <button class="dbtn rbn-sm" id="objects-btn"
                aria-pressed="false"
                title="List everything on this page, and hide or lock any
 of it"><i data-ic="objects"></i> Objects</button>
              <button class="dbtn primary rbn-sm" id="dc-play"
                title="Play this full screen, from this page">
                <i data-ic="play"></i> Present</button>
            </span>
            <span class="rbn-lab">View</span>
          </span>
          <span class="rbn-grp rbn-insert">
            <span class="rbn-row">
              <!-- All one size. Three big buttons here were the worst of
                   the "so many sizes" problem (2026-08-07): nothing shared
                   a baseline and no size meant anything. Emphasis is
                   carried by COLOUR now — Present is the one accented
                   control — so every other button can be identical. -->
              <button class="dbtn et rbn-sm" data-tool="cell"
                aria-pressed="false"
                title="Place a figure, table or note from your notebook —
 you pick which one"><i data-ic="cellcard"></i> Notebook cell</button>
              <button class="dbtn et rbn-sm" data-tool="text"
                aria-pressed="false"
                title="Add a text box"><i data-ic="text"></i> Text box</button>
              <button class="dbtn rbn-sm" id="et-image"
                title="Add an image from your computer. You can also
 paste one straight from the clipboard"
                ><i data-ic="image"></i> Image</button>
              <button class="dbtn rbn-sm et" id="dc-qr"
                title="Insert a QR code that links to your repo / paper /
 data — generated right here, prints crisp (vector)"
                ><i data-ic="qr"></i> QR code</button>
              <!-- Source order IS the layout: with two rows filled across,
                   the first four land on the top row and the rest below.
                   So things you PLACE sit together up top and things you
                   DRAW sit together underneath — which is how Line and
                   Arrow, the same tool with and without a head, finally
                   end up beside each other (2026-08-07, user). -->
              <span class="sh-drop" id="sh-drop">
                <button class="dbtn rbn-sm" id="sh-btn"
                  aria-haspopup="true" aria-expanded="false"
                  title="Draw a shape (rectangle, ellipse, star, …)">
                  <i data-ic="shapes"></i> Shape &#9662;</button>
                <div class="sh-menu" id="sh-menu" hidden></div>
              </span>
              <button class="dbtn rbn-sm" id="dc-line"
                title="Draw a line — a section divider for posters and
 slides. Drag its endpoints to reroute or angle it."
                ><i data-ic="hline"></i> Line</button>
              <button class="dbtn rbn-sm et" data-tool="arrow"
                aria-pressed="false" title="Draw an arrow — a line with a
 head. Drop an end on an item to attach it, and the arrow follows that
 item around"><i data-ic="arrow"></i> Arrow</button>
              <input type="file" id="img-file" accept="image/*" hidden>
            </span>
            <span class="rbn-lab">Insert</span>
          </span>
        </div>
        <span class="et-fmt" id="et-fmt" hidden>
          <span class="rbn-grp">
            <span class="rbn-row">
              <!-- Bring-to-front, send-to-back and the two rotates used to
                   sit here as bare glyphs (&#8613; &#8615; &#10226;
                   &#10227;) with their meaning only in a tooltip — the
                   same wordless-button problem as everywhere else. They
                   now live in this menu, fully worded, which removes four
                   controls from the row AND adds four labels. -->
              <button class="dbtn etm" id="fmt-dup"
                title="Duplicate (Ctrl+D)">&#10697; Copy</button>
              <button class="dbtn etm" id="fmt-group"
                title="Group the selected items (Ctrl+G)">&#9783;
                Group</button>
              <button class="dbtn etm" id="fmt-ungroup"
                title="Ungroup (Ctrl+Shift+G)">Ungroup</button>
              <span class="sh-drop" id="fmt-alignwrap">
                <button class="dbtn etm" id="fmt-align-btn"
                  aria-haspopup="true" aria-expanded="false"
                  title="Line the selected items up, space them evenly,
 change what sits in front, or rotate">
                  &#8676; Arrange &#9662;</button>
                <div class="sh-menu align-menu" id="fmt-align-menu"
                  hidden></div>
              </span>
              <button class="dbtn etm" id="fmt-front" hidden
                title="Bring to front">&#8613;</button>
              <button class="dbtn etm" id="fmt-back" hidden
                title="Send to back">&#8615;</button>
              <button class="dbtn etm" id="fmt-rotl" hidden
                title="Rotate left 15&#176;">&#10226;</button>
              <button class="dbtn etm" id="fmt-rotr" hidden
                title="Rotate right 15&#176;">&#10227;</button>
              <button class="dbtn etm" id="fmt-arline" hidden
                title="Arrange the selected items in a row: middles aligned, equal gaps"
                >&#8943; Row</button>
              <button class="dbtn etm" id="fmt-argrid" hidden
                title="Arrange the selected items in a grid">&#8862;
                Grid</button>
              <span class="sh-drop" id="fmt-samewrap" hidden>
                <button class="dbtn etm" id="fmt-same" aria-haspopup="true"
                  aria-expanded="false"
                  title="Make the selected items the same size">&#9713;
                  Same size &#9662;</button>
                <div class="sh-menu same-menu" id="fmt-same-menu"
                  hidden></div>
              </span>
            </span>
            <span class="rbn-lab">Arrange</span>
          </span>
          <span class="rbn-grp">
            <span class="rbn-row">
              <span class="fmt-opwrap" id="fmt-opwrap"
                title="Opacity (0&ndash;100%)">
                <input class="fmt-range" id="fmt-op" type="range"
                  min="0" max="100" step="1" aria-label="Opacity percent">
                <span class="fmt-opval" id="fmt-opval">100%</span></span>
              <span class="sh-drop" id="fmt-animwrap" hidden>
                <button class="dbtn etm" id="fmt-anim" aria-haspopup="true"
                  aria-expanded="false"
                  title="Animate this item so it appears on click">&#9654;
                  Animate &#9662;</button>
                <div class="sh-menu" id="fmt-anim-menu" hidden></div>
              </span>
            </span>
            <span class="rbn-lab">Effects</span>
          </span>
          <!-- colour swatches live behind two POPUP buttons: fourteen
               always-visible circles said "look at me" louder than the
               poster did (2026-08-05, user: "do you need to display all
               the colours all the time?") -->
          <span class="rbn-grp">
            <span class="rbn-row">
              <span class="sh-drop">
                <button class="dbtn" id="fmt-txcol-btn" hidden
                  aria-haspopup="true" aria-expanded="false"
                  title="Colour of the selected text / line / shape">
                  Colour &#9662;</button>
                <div class="sh-menu sw-menu" id="fmt-txcol-menu" hidden>
                  <span class="fmt-lab" id="fmt-txlab" hidden
                    title="Text colour">Text</span>
                  <button class="sw" data-c="#ff6b57"
                    style="background:#ff6b57" title="Coral"></button>
                  <button class="sw" data-c="#f0a848"
                    style="background:#f0a848" title="Amber"></button>
                  <button class="sw" data-c="#39a9c0"
                    style="background:#39a9c0" title="Cyan"></button>
                  <button class="sw" data-c="#46a892"
                    style="background:#46a892" title="Green"></button>
                  <button class="sw" data-c="#ffffff"
                    style="background:#ffffff" title="White"></button>
                  <button class="sw" data-c="#16202b"
                    style="background:#16202b" title="Ink"></button>
                  <button class="sw sw-custom" id="sw-custom"
                    data-target="text"
                    title="Custom colour — hex, rgb or rgba"></button>
                </div>
              </span>
              <span class="sh-drop">
                <button class="dbtn" id="fmt-fillcol-btn" hidden
                  aria-haspopup="true" aria-expanded="false"
                  title="Fill / background colour of the selected box">
                  Fill &#9662;</button>
                <div class="sh-menu sw-menu" id="fmt-fillcol-menu" hidden>
                  <span class="fmt-lab" id="fmt-bglab" hidden
                    title="Fill / background colour">Fill</span>
                  <button class="sw swbg trans" data-c="none" hidden
                    title="Transparent box"></button>
                  <button class="sw swbg" data-c="#0e1926" hidden
                    style="background:#0e1926" title="Dark box"></button>
                  <button class="sw swbg" data-c="#ffffff" hidden
                    style="background:#ffffff" title="White box"></button>
                  <button class="sw swbg" data-c="#ff6b57" hidden
                    style="background:#ff6b57" title="Coral box"></button>
                  <button class="sw swbg" data-c="#f0a848" hidden
                    style="background:#f0a848" title="Amber box"></button>
                  <button class="sw swbg" data-c="#39a9c0" hidden
                    style="background:#39a9c0" title="Cyan box"></button>
                  <button class="sw swbg sw-custom" id="swbg-custom" hidden
                    data-target="fill"
                    title="Custom fill colour — hex, rgb or rgba"></button>
                </div>
              </span>
            </span>
            <span class="rbn-lab">Colour</span>
          </span>
          <span class="rbn-grp">
            <span class="rbn-row">
              <button class="dbtn etm" id="fmt-smaller"
                title="Smaller text">A&#8722;</button>
              <button class="dbtn etm" id="fmt-bigger"
                title="Bigger text">A+</button>
              <span class="fmt-szwrap" id="fmt-szwrap" hidden
                title="Text size (points)">
                <input class="fmt-num" id="fmt-size" type="number"
                  min="6" max="240" step="1"
                  aria-label="Text size in points">
                <span class="fmt-unit">pt</span></span>
              <select class="etm" id="fmt-font" hidden title="Text font">
                <option value="sans">Sans</option>
                <option value="serif">Serif</option>
                <option value="mono">Mono</option>
                <option value="system">System</option>
                <option value="hand">Hand</option>
              </select>
              <button class="dbtn etm" id="fmt-bold"
                title="Bold"><b>B</b></button>
              <button class="dbtn etm" id="fmt-ital"
                title="Italic"><i>I</i></button>
              <button class="dbtn etm" id="fmt-under"
                title="Underline"><u>U</u></button>
              <button class="dbtn etm" id="fmt-strike"
                title="Strikethrough"><s>S</s></button>
              <!-- alignment, bullets and curve are all "how this text is
                   laid out"; one worded menu instead of three controls -->
              <span class="sh-drop" id="fmt-parawrap">
                <button class="dbtn etm" id="fmt-para" aria-haspopup="true"
                  aria-expanded="false"
                  title="How the text sits: alignment, bullet list, and
 bending it along a curve">&#9636; Layout &#9662;</button>
                <div class="sh-menu para-menu" id="fmt-para-menu"
                  hidden></div>
              </span>
              <button class="dbtn etm" id="fmt-align" hidden
                title="Text alignment (click to cycle)">&#9636; Left</button>
              <button class="dbtn etm" id="fmt-list" hidden
                title="Bullet list (Enter adds a point)">&#8226; List</button>
              <span class="sh-drop" id="fmt-arcwrap" hidden>
                <button class="dbtn etm" id="fmt-arc" aria-haspopup="true"
                  aria-expanded="false"
                  title="Bend the text along a curve">&#8631; Curve
                  &#9662;</button>
                <div class="sh-menu arc-menu" id="fmt-arc-menu" hidden></div>
              </span>
            </span>
            <span class="rbn-lab">Text</span>
          </span>
          <span class="rbn-grp">
            <span class="rbn-row">
              <span class="rbn-stack rbn-cols">
                <span class="rbn-col">
                  <span class="sh-drop" id="fmt-stylewrap">
                    <button class="dbtn rbn-sm" id="fmt-style"
                      aria-haspopup="true" aria-expanded="false"
                      title="Line style — solid, dashed, dotted,
 dash-dot">&#9473; Style &#9662;</button>
                    <div class="sh-menu style-menu" id="fmt-style-menu"
                      hidden></div>
                  </span>
                  <button class="dbtn rbn-sm etm" id="fmt-line"
                    title="Cycle line thickness">&#9776; Weight</button>
                </span>
                <span class="rbn-col">
                  <span class="sh-drop" id="fmt-headwrap">
                    <button class="dbtn rbn-sm" id="fmt-head"
                      aria-haspopup="true" aria-expanded="false"
                      title="Arrow ends — head shape at each end, and how
 big">&#10230; Ends &#9662;</button>
                    <div class="sh-menu head-menu" id="fmt-head-menu"
                      hidden></div>
                  </span>
                  <span class="sh-drop" id="fmt-bendwrap">
                    <button class="dbtn rbn-sm" id="fmt-bend"
                      aria-haspopup="true" aria-expanded="false"
                      title="Route — straight, curved, or elbowed round a
 corner">&#8631; Route &#9662;</button>
                    <div class="sh-menu bend-menu" id="fmt-bend-menu"
                      hidden></div>
                  </span>
                </span>
                <span class="rbn-col">
                  <span class="sh-drop" id="fmt-fillwrap">
                    <button class="dbtn rbn-sm" id="fmt-fillstyle"
                      aria-haspopup="true" aria-expanded="false"
                      title="Fill — none, solid, or a gradient (linear or
 radiating from the centre)">&#9724; Fill &#9662;</button>
                    <div class="sh-menu fillstyle-menu"
                      id="fmt-fillstyle-menu" hidden></div>
                  </span>
                  <button class="dbtn rbn-sm etm" id="fmt-shape"
                    title="Cycle the shape (rectangle, ellipse, star, …)">
                    &#9711; Shape</button>
                </span>
              </span>
              <button class="dbtn etm" id="fmt-dash" hidden
                title="Dashed on/off">Dash</button>
              <button class="dbtn etm" id="fmt-fill" hidden
                title="Fill on/off">Fill</button>
            </span>
            <span class="rbn-lab">Line &amp; shape</span>
          </span>
          <span class="rbn-grp">
            <span class="rbn-row">
              <span class="rbn-partslot" id="fmt-parts" hidden></span>
              <span class="sh-drop" id="fmt-cropwrap" hidden>
                <button class="dbtn etm" id="fmt-crop" aria-haspopup="true"
                  aria-expanded="false"
                  title="Crop to a shape (rectangle, ellipse, star, …)">
                  &#9986; Crop &#9662;</button>
                <div class="sh-menu" id="fmt-crop-menu" hidden></div>
              </span>
              <button class="dbtn etm" id="fmt-replace"
                title="Swap in a different notebook card">&#8644;
                Replace</button>
              <button class="dbtn etm" id="fmt-locate"
                title="Jump to this card in its notebook &mdash; see where
 the plot came from">&#8982; Locate in notebook</button>
              <button class="dbtn etm" id="fmt-revert"
                title="Swap this frame between the LIVE figure and the one
 from before the last notebook refresh (rescue a figure a re-run
 broke without giving up the others)">&#10226; Previous figure</button>
              <button class="dbtn etm" id="fmt-lockver"
                title="Pin this figure to its notebook&rsquo;s current git
 commit &mdash; refreshes stop changing it, and it renders even with the
 notebook closed">&#128274; Lock figure</button>
            </span>
            <span class="rbn-lab">Object</span>
          </span>
        </span>
        <span class="et-hint" id="et-hint"></span>
      </div>
      <aside class="selpane preflight" id="preflight" hidden>
        <div class="selpane-h"><span>Before you print</span>
          <button class="dbtn dc-icon" id="preflight-rerun"
            title="Check again">&#8635;</button>
          <button class="dbtn dc-icon" id="preflight-close"
            title="Close">&#10005;</button></div>
        <div class="pf-count" id="preflight-count"></div>
        <div class="selpane-list" id="preflight-list"></div>
      </aside>
      <aside class="selpane" id="selpane" hidden>
        <div class="selpane-h"><span>Objects</span>
          <button class="dbtn dc-icon" id="selpane-close"
            title="Close">&#10005;</button></div>
        <div class="selpane-list" id="selpane-list"></div>
      </aside>
      <button class="deck-arrow prev" id="deck-prev"
        title="Previous slide (&#8592;)"
        aria-label="Previous slide">&#8249;</button>
      <!-- rulers overlay the stage rather than sitting in its flow: the
           slide must not move or resize when they are switched on -->
      <div class="rulers" id="rulers" hidden aria-hidden="true">
        <div class="ruler ruler-h" id="ruler-h"></div>
        <div class="ruler ruler-v" id="ruler-v"></div>
        <div class="ruler-corner" id="ruler-corner">mm</div>
      </div>
      <div class="deck-stage" id="deck-stage"></div>
      <button class="deck-arrow next" id="deck-next"
        title="Next slide (&#8594;)"
        aria-label="Next slide">&#8250;</button>
      <button class="deck-arrow up" id="deck-up" hidden
        title="Back to the slide (&#8593;)"
        aria-label="Back up to the slide">&#8593;</button>
      <button class="deck-codepill" id="deck-down" hidden
        title="Scroll down to the code trace (&#8595;)"
        aria-label="Show the code trace that made this slide">
        <span class="cp-arr">&#8595;</span> Show code</button>
      <span class="deck-count" id="deck-count"></span>
    </div>
  </div>
  <div class="vfull" id="vfull" hidden>
    <div class="vfull-head">
      <span class="chain-badge" id="vfull-badge"></span>
      <span class="vfull-t" id="vfull-t"></span>
      <button class="dbtn" id="vfull-close"
        title="Close (Esc)">&#10005; Close</button>
    </div>
    <div class="vfull-body" id="vfull-body"></div>
  </div>
  <div class="deck-toast" id="deck-toast" hidden></div>
</div>
<div class="pickbar" id="pickbar" hidden>
  <span>&#128204; Click a card in the notebook to place it in the
  slide</span>
  <span class="deck-spring"></span>
  <button class="dbtn" id="pick-cancel">Cancel (Esc)</button>
</div>
<div class="color-pop" id="color-pop" hidden>
  <div class="cp-head" id="cp-head">Custom colour</div>
  <input type="color" id="cp-native" class="cp-native" value="#39a9c0"
    aria-label="Pick a colour">
  <div class="cp-row">
    <span class="cp-lab">Hex</span>
    <input type="text" id="cp-hex" class="cp-in" spellcheck="false"
      autocomplete="off" placeholder="#39a9c0" maxlength="9">
  </div>
  <div class="cp-row">
    <span class="cp-lab">RGB</span>
    <input type="text" id="cp-rgb" class="cp-in" spellcheck="false"
      autocomplete="off" placeholder="rgba(57, 169, 192, 1)">
  </div>
  <div class="cp-row cp-arow">
    <span class="cp-lab">Alpha</span>
    <input type="range" id="cp-alpha" class="cp-alpha" min="0" max="100"
      step="1" value="100" aria-label="Opacity">
    <span class="cp-aval" id="cp-aval">100%</span>
  </div>
  <div class="cp-recent" id="cp-recent"></div>
  <div class="cp-foot">
    <span class="cp-preview" id="cp-preview"></span>
    <span class="deck-spring"></span>
    <button class="dbtn cp-apply" id="cp-apply">Apply</button>
  </div>
</div>
