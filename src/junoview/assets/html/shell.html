<div class="shell nbshell" data-nb="{stem}"{path_attr}{kind_attr}>
  <aside class="rail">
    <div class="railhead">
      <!-- The outline owns only section navigation. Open documents are
           available in the top tabs and the app rail, not a third list. -->
      <details class="outline-tools">
        <summary class="rf-btn"><i data-ic="outline"></i>Outline options</summary>
        <div class="outline-options-menu">
          <button class="rf-btn outline-collapse" type="button"><i data-ic="minus"></i>Collapse all</button>
          <button class="rf-btn outline-expand" type="button"><i data-ic="plus"></i>Expand all</button>
          <label><input class="outline-hidden" type="checkbox" checked> Show hidden sections</label>
          <button class="rf-btn rf-unhide" type="button" aria-pressed="false"
            title="Temporarily reveal hidden sections, headings and cells without changing what is saved as hidden"><i data-ic="eye"></i>Peek at hidden</button>
        </div>
      </details>
      <div class="railfile">
        <!-- Info is docked in the compact file utility line. Keeping the
             label short avoids repeating the same file identity. -->
        <button class="rf-btn rf-info" type="button"
          title="Where this notebook came from — its path, its git commit,
 and every earlier version you can open"><i data-ic="info"></i>Info
          &#9662;</button>
        <!-- T364: it wears its word now. In the sidebar it was a
             small glyph beside a wide File info; docked in the ribbon
             it is a ribbon button, and this project has rejected
             icon-only buttons twice. -->
        <button class="rf-btn rf-reload" type="button"
          aria-label="Reload this notebook"
          title="Reload this notebook from
 disk"><i data-ic="reload"></i>Reload</button>
        <!-- shown only while something IS hidden: a permanent button for a
             state you are usually not in is clutter -->
      </div>
      <div class="rf-panel" hidden></div>
    </div>
    {railtabs}
    {nav}
    {varpanel}
    {graph_panel}
  </aside>
  <main class="stage">
    <div class="content">
      {sections}
    </div>
    <div class="rawview">
      {rawview}
    </div>
    <div class="treeview" aria-label="Analysis tree view"></div>
  </main>
  <script type="application/json" class="nb-data">{nb_data}</script>
</div>
