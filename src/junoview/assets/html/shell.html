<div class="shell nbshell" data-nb="{stem}"{path_attr}>
  <aside class="rail">
    <div class="railhead">
      <!-- WHICH NOTEBOOKS ARE OPEN, at the top of the sidebar you are
           already reading. The presentations rail lists them too, but it
           collapses and auto-hides, and with it away nothing on screen
           said a second notebook existed (2026-08-21, user: "the sidebar
           doesn't show notebooks that are open"). Filled by renderTabs();
           it stays hidden when there is only one and nothing to open. -->
      <div class="railnbs" hidden></div>
      <!-- THE NOTEBOOK'S NAME, not its first heading. This line used to
           be doc.title, which is whatever the file's first `# ` says --
           so a notebook opening with "# Preamble" was labelled Preamble,
           a section name standing in for a file name (2026-08-21, user:
           "Preamble is not the name of the notebook, that is a section").
           The heading did not lose its place; it moved one line down. -->
      <h1 class="railtitle" title="{stem}">{stem}</h1>
      {doctitle}
      <div class="railmeta">{meta}</div>
      <div class="railfile">
        <button class="rf-btn rf-info" type="button"
          title="Where this notebook came from — its path, its git commit,
 and every earlier version you can open">File info
          &#9662;</button>
        <button class="rf-btn rf-reload" type="button"
          title="Reload this notebook from disk">&#8635;</button>
        <!-- shown only while something IS hidden: a permanent button for a
             state you are usually not in is clutter -->
        <button class="rf-btn rf-unhide" type="button" hidden
          title="Bring back every hidden section, heading and cell in this
 notebook">Show all hidden</button>
      </div>
      <div class="rf-panel" hidden></div>
    </div>
    {railtabs}
    {nav}
    {varpanel}
    {graph_panel}
  </aside>
  <main class="stage">
    <div class="content">
      <div class="docbar" hidden>
        <span class="docbar-ic">&#128196;</span>
        <span class="docbar-nm">{stem}</span>
        <span class="docbar-p"></span>
      </div>
      {sections}
    </div>
    <div class="rawview">
      {rawview}
    </div>
    <div class="treeview" aria-label="Analysis tree view"></div>
  </main>
  <script type="application/json" class="nb-data">{nb_data}</script>
</div>
