<style>
  body{margin:0;background:#0a141d;color:#cdd9e3;
    font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;
    align-items:center;justify-content:center;min-height:100vh;}
  .boot{text-align:center;max-width:420px;padding:30px;}
  .boot h1{font-size:14px;letter-spacing:.22em;text-transform:uppercase;
    color:#39a9c0;font-weight:600;}
  .boot p{font-size:12.5px;line-height:1.7;color:#7e93a4;}
  .bar{height:3px;background:#16273a;border-radius:3px;overflow:hidden;
    margin-top:18px;}
  .bar i{display:block;height:100%;width:30%;background:#39a9c0;
    border-radius:3px;animation:sl 1.2s ease-in-out infinite alternate;}
  @keyframes sl{from{margin-left:0}to{margin-left:70%}}
  /* the tour: shown while Pyodide downloads, and it is the only "front
     page" this domain has — the app boots straight into index.html */
  .boot{max-width:520px;padding:30px;text-align:center;}
  .boot h1{font-size:15px;margin:0 0 22px;}
  #bootmsg{margin:0;font-size:11.5px;color:#5d7488;}
  /* the tip: one useful thing to know while the runtime starts */
  .tip{margin-top:30px;display:flex;gap:10px;align-items:flex-start;
    text-align:left;padding:0;}
  .tip[hidden]{display:none;}
  .tip-k{font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:#39a9c0;padding-top:3px;flex:none;}
  .tip-t{font-size:13px;line-height:1.65;color:#a8b8c6;}
  .tip-t b{color:#eef4f8;font-weight:600;}
  @media (max-width:640px){.boot{padding:26px 14px 50px;}
    .tour{gap:24px;}}

<body>
<div class="boot" id="boot">
  <h1>Junoview</h1>
  <p id="bootmsg">Starting&#8230;</p>
  <div class="bar"><i></i></div>
  <!-- a different tip each visit: the wait is short, so this is a thing
       worth knowing rather than an apology for a delay -->
  <div class="tip" id="tip" hidden>
    <span class="tip-k">Tip</span>
    <span class="tip-t" id="tip-t"></span>
  </div>
</div>
<script>
(function(){
  var TIPS=[
    'Press <b>Code: Off</b> to strip a notebook down to its figures, then '
      +'<b>Present</b> to show it full screen.',
    'The <b>Types</b> button under each filter is finer-grained: keep the '
      +'plotting code, drop the imports.',
    '<b>Apply to</b> sets filters per section &mdash; show the code in '
      +'Methods and hide it everywhere else.',
    'Click <b>Plot trace</b> on any figure to see the exact chain of cells '
      +'that produced it.',
    '<b>Tree</b> lays the whole notebook out as a dependency map, so you '
      +'can see what feeds what.',
    'The eye on a cell, heading or section hides it. Nothing is deleted, '
      +'and <b>Show all hidden</b> in the sidebar brings it back.',
    'A <b>custom view</b> saves your filters and restyles the markdown &mdash; '
      +'a reusable way to look at the same notebook.',
    'Drag a figure onto a slide, then re-run the notebook: the slide '
      +'follows. No re-exporting screenshots.',
    '<b>+ New poster</b> gives you an A0 page with a conference-poster '
      +'template already applied.',
    'Everything runs in your browser. Your notebooks never leave your '
      +'computer.',
    'Opened from a GitHub URL? <b>File info</b> shows the commit, and you '
      +'can open any earlier version of the notebook.',
    'The <b>Text</b> and <b>Figures</b> steppers scale prose and plots '
      +'separately &mdash; handy on a projector.',
    'After this first visit Junoview also works <b>offline</b> &mdash; and '
      +'installs as an app from the browser menu.'
  ];
  var el=document.getElementById('tip-t'),box=document.getElementById('tip');
  if(el&&box){
    el.innerHTML=TIPS[Math.floor(Math.random()*TIPS.length)];
    box.hidden=false;
  }
})();
</script>
<script>
/* the offline app: sw.js caches this page, the renderer and the Python
   runtime on first visit, so later visits — and the installed app — need
   no internet. Registered before Pyodide starts, so the very first visit
   precaches in parallel with the first boot. Fails soft everywhere a
   worker cannot run (file://, plain http). */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
  /* A NEWER BUILD ANNOUNCES ITSELF (T206; 2026-09-02). The worker
     caches the whole app, so the first visit after a deploy boots the
     PREVIOUS build from cache while the new worker installs and takes
     over (skipWaiting + claim). Nothing said so, and a reviewer sent
     screenshots of a build five deploys old, three times, believing
     nothing had changed. When a new worker takes control of a page
     that already had one, that page is running the old build: say so,
     with a Reload button, and keep saying so on the app page the
     loader is about to document.write over (app.js asks at boot). */
  var hadWorker=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!hadWorker) return;              /* first install: nothing older */
    window.__jvNewBuild=true;
    if(window.__jvUpdateBar) window.__jvUpdateBar();
  });
}
window.__jvBuild='93724543309c';
window.__jvUpdateBar=function(){
  if(document.getElementById('jv-newbuild')||!document.body) return;
  var bar=document.createElement('div');
  bar.id='jv-newbuild';
  bar.setAttribute('role','status');
  bar.style.cssText='position:fixed;left:50%;top:10px;transform:translateX(-50%);'
    +'z-index:100000;display:flex;align-items:center;gap:12px;padding:8px 14px;'
    +'border-radius:10px;background:#123;color:#e8f1f8;border:1px solid #39a9c0;'
    +'box-shadow:0 10px 30px #0008;font:13px system-ui,sans-serif;';
  var t=document.createElement('span');
  t.textContent='A newer Junoview just arrived. This page is still the '
    +'previous one.';
  var b=document.createElement('button');
  b.type='button';b.textContent='Reload';
  b.style.cssText='font:inherit;padding:4px 12px;border-radius:7px;'
    +'border:1px solid #39a9c0;background:#1f7e93;color:#fff;cursor:pointer;';
  b.addEventListener('click',function(){location.reload();});
  var x=document.createElement('button');
  x.type='button';x.textContent='Later';x.setAttribute('aria-label','Later');
  x.style.cssText='font:inherit;padding:4px 10px;border-radius:7px;'
    +'border:1px solid #ffffff33;background:none;color:#c9d6e2;cursor:pointer;';
  x.addEventListener('click',function(){bar.remove();});
  bar.appendChild(t);bar.appendChild(b);bar.appendChild(x);
  document.body.appendChild(bar);
};
/* the browser's install offer arrives as an event, and this document is
   about to be REPLACED by document.write — the window (and its globals)
   survives that, so the app page can still show a button for it */
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();window.__jvInstall=e;
});
</script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
(async function(){
  var msg=document.getElementById('bootmsg');
  function say(t){if(msg) msg.textContent=t;}
  try{
    var py=await loadPyodide();
    say('Loading the renderer…');
    // The renderer ships as a zipped package rather than a single module:
    // unpackArchive writes the tree into Pyodide's filesystem, from which
    // both import and importlib.resources (the CSS/JS assets) work.
    var zip=await (await fetch('junoview.zip')).arrayBuffer();
    py.unpackArchive(zip,'zip');
    py.runPython('import junoview as sr');
    var page=py.runPython('sr.render_page([], mode="web")');
    document.open();document.write(page);document.close();
    window.semPy={
      parse:function(name,text,taken){
        py.globals.set('_wname',String(name));
        py.globals.set('_wtext',text);
        py.globals.set('_wtaken',JSON.stringify(taken||[]));
        return py.runPython('sr.web_parse(_wname,_wtext,_wtaken)');
      },
      // the binary half (T113): a .xlsx has no text to hand over
      parseB64:function(name,b64,taken){
        py.globals.set('_wname',String(name));
        py.globals.set('_wtext',b64);
        py.globals.set('_wtaken',JSON.stringify(taken||[]));
        return py.runPython('sr.web_parse_b64(_wname,_wtext,_wtaken)');
      }
    };
    document.dispatchEvent(new Event('sem:pyready'));
  }catch(e){
    say('Failed to start: '+(e&&e.message?e.message:e)
      +' — check your connection and reload.');
  }
})();
</script>
