<!-- The title leads with what it DOES, not the product name: searching
     "junoview" collides with an unrelated asset-management product, so
     the words that earn the click are the problem it solves. -->
<title>Junoview &mdash; figure-first Jupyter notebook viewer and
 presentation builder</title>
<meta name="description" content="Read executed Jupyter notebooks as
 figures, not cells: filter code and output away, hide sections, and build
 slides or a conference poster from the same cells. Runs in your browser,
 no install, nothing uploaded.">
<meta name="keywords" content="jupyter notebook viewer, notebook to
 slides, jupyter presentation, figure-first, ipynb viewer, xarray,
 matplotlib, anywidget, reproducible research">
<link rel="canonical" href="https://junoview.dev/">
<meta property="og:title" content="Junoview &mdash; figure-first Jupyter
 notebook viewer and presentation builder">
<meta property="og:description" content="Read executed Jupyter notebooks
 as figures, not cells &mdash; then build slides or a poster from the same
 cells. In your browser, nothing uploaded.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://junoview.dev/">
<meta property="og:site_name" content="Junoview">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Junoview &mdash; figure-first Jupyter
 notebook viewer">
<meta name="twitter:description" content="Read notebooks as figures, not
 cells. Build slides and posters from the same cells, in your browser.">
<style>
  body{margin:0;background:#0a141d;color:#cdd9e3;
    font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;
    align-items:center;justify-content:center;min-height:100vh;}
  .boot{text-align:center;max-width:420px;padding:30px;}
  .boot h1{font-size:14px;letter-spacing:.22em;text-transform:uppercase;
    color:#39a9c0;font-weight:600;}
  .boot p{font-size:12.5px;line-height:1.7;color:#7e93a4;}
  .bar{height:3px;background:#16273a;border-radius:3px;overflow:hidden;
    margin-top:18px;}
  .bar i{display:block;height:100%;width:30%;background:#39a9c0;
    border-radius:3px;animation:sl 1.2s ease-in-out infinite alternate;}
  @keyframes sl{from{margin-left:0}to{margin-left:70%}}
  /* the tour: shown while Pyodide downloads, and it is the only "front
     page" this domain has — the app boots straight into index.html */
  body{align-items:flex-start;}
  .boot{max-width:1180px;padding:46px 24px 70px;text-align:left;}
  .boot h1{font-size:15px;}
  .tag{font-size:15px!important;line-height:1.6!important;
    color:#cdd9e3!important;max-width:640px;margin:14px 0 20px;}
  .tag b{color:#eef4f8;}
  .tag2{font-size:12.5px!important;color:#7e93a4!important;
    max-width:640px;margin:0 0 4px;}
  .tag2 code{color:#39a9c0;}
  /* the tip: one useful thing to know while the runtime starts */
  .tip{margin-top:26px;display:flex;gap:11px;align-items:flex-start;
    max-width:640px;border-left:2px solid #2a7d90;padding:2px 0 2px 14px;}
  .tip[hidden]{display:none;}
  .tip-k{font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:#39a9c0;padding-top:3px;flex:none;}
  .tip-t{font-size:13px;line-height:1.65;color:#a8b8c6;}
  .tip-t b{color:#eef4f8;font-weight:600;}
  @media (max-width:640px){.boot{padding:26px 14px 50px;}
    .tour{gap:24px;}}
</style>
</head>
<body>
<div class="boot" id="boot">
  <h1>Junoview</h1>
  <p class="tag">Your notebook, without the clutter. <b>See the figures,
  hide the code, keep only the cells you want</b> &mdash; then turn the
  same cells into slides or a poster.</p>
  <p class="tag2">Drop in an <code>.ipynb</code> you have already run.
  It stays on your computer &mdash; nothing is uploaded.</p>
  <p id="bootmsg">Starting&#8230;</p>
  <div class="bar"><i></i></div>
  <!-- a different tip each visit: the wait is short, so this is a thing
       worth knowing rather than an apology for a delay -->
  <div class="tip" id="tip" hidden>
    <span class="tip-k">Tip</span>
    <span class="tip-t" id="tip-t"></span>
  </div>
</div>
<script>
(function(){
  var TIPS=[
    'Press <b>Code: Off</b> to strip a notebook down to its figures, then '
      +'<b>Present</b> to show it full screen.',
    'The <b>Types</b> button under each filter is finer-grained: keep the '
      +'plotting code, drop the imports.',
    '<b>Apply to</b> sets filters per section &mdash; show the code in '
      +'Methods and hide it everywhere else.',
    'Click <b>Plot trace</b> on any figure to see the exact chain of cells '
      +'that produced it.',
    '<b>Tree</b> lays the whole notebook out as a dependency map, so you '
      +'can see what feeds what.',
    'The eye on a cell, heading or section hides it. Nothing is deleted, '
      +'and <b>Show all hidden</b> in the sidebar brings it back.',
    'A <b>custom view</b> saves your filters and restyles the markdown &mdash; '
      +'a reusable way to look at the same notebook.',
    'Drag a figure onto a slide, then re-run the notebook: the slide '
      +'follows. No re-exporting screenshots.',
    '<b>+ New poster</b> gives you an A0 page with a conference-poster '
      +'template already applied.',
    'Everything runs in your browser. Your notebooks never leave your '
      +'computer.',
    'Opened from a GitHub URL? <b>File info</b> shows the commit, and you '
      +'can open any earlier version of the notebook.',
    'The <b>Text</b> and <b>Figures</b> steppers scale prose and plots '
      +'separately &mdash; handy on a projector.'
  ];
  var el=document.getElementById('tip-t'),box=document.getElementById('tip');
  if(el&&box){
    el.innerHTML=TIPS[Math.floor(Math.random()*TIPS.length)];
    box.hidden=false;
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
(async function(){
  var msg=document.getElementById('bootmsg');
  function say(t){if(msg) msg.textContent=t;}
  try{
    var py=await loadPyodide();
    say('Loading the renderer…');
    var src=await (await fetch('semantic_render.py')).text();
    py.FS.writeFile('semantic_render.py',src);
    py.runPython('import semantic_render as sr');
    var page=py.runPython('sr.render_page([], mode="web")');
    document.open();document.write(page);document.close();
    window.semPy={
      parse:function(name,text,taken){
        py.globals.set('_wname',String(name));
        py.globals.set('_wtext',text);
        py.globals.set('_wtaken',JSON.stringify(taken||[]));
        return py.runPython('sr.web_parse(_wname,_wtext,_wtaken)');
      }
    };
    document.dispatchEvent(new Event('sem:pyready'));
  }catch(e){
    say('Failed to start: '+(e&&e.message?e.message:e)
      +' — check your connection and reload.');
  }
})();
</script>
</body>
</html>
