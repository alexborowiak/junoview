[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "junoview"
version = "0.1.0"
description = "Junoview — figure-first Jupyter notebook viewing and slide decks. Streamline presentations from Jupyter: display your plots and documentation, single file, stdlib only"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alex Borowiak" }]
keywords = ["jupyter", "notebook", "visualization", "presentation", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Framework :: Jupyter",
]

[project.urls]
# TODO: point these at the junoview repo/domain once they exist
Homepage = "https://github.com/alexborowiak/semantic-rendering"
Repository = "https://github.com/alexborowiak/semantic-rendering"

[project.optional-dependencies]
widget = ["anywidget", "ipywidgets"]

[project.scripts]
junoview = "semantic_render:main"

[tool.setuptools]
py-modules = ["semantic_render", "semantic_widget"]
