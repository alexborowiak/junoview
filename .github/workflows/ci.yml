name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

      # The frontend is plain .js files with no build step, so nothing else
      # parses them before a browser does. The runners ship node; contributors
      # still need no toolchain of their own.
      - name: JS syntax check
        run: |
          for f in src/junoview/assets/js/*.js; do node --check "$f"; done
          # js/deck/ holds fragments of one IIFE (T36) -- checking one
          # means nothing, so check what actually ships.
          python -c "import sys; sys.path.insert(0, 'src'); from junoview import assets; open('deck.assembled.js','w',encoding='utf-8',newline='\n').write(assets.deck_js())"
          node --check deck.assembled.js && rm deck.assembled.js

  build:
    name: package builds and the CLI runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build

      # Install the wheel somewhere clean and drive the real entry point. This
      # is what catches a missing asset: the package imports fine from a source
      # checkout even when package-data is misdeclared, and only fails once
      # installed.
      - name: install the wheel and render a notebook
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/junoview "$GITHUB_WORKSPACE/examples/example_climate_analysis.ipynb" -o /tmp/out.html
          test -s /tmp/out.html

      - name: build the static web app
        run: |
          /tmp/venv/bin/junoview --build-web /tmp/web
          test -s /tmp/web/index.html
          test -s /tmp/web/junoview.zip
          test -s /tmp/web/LICENSE
          test -s /tmp/web/NOTICE
          test -s /tmp/web/THIRD_PARTY_NOTICES.html

      - name: the web bundle is reproducible
        run: |
          /tmp/venv/bin/junoview --build-web /tmp/web2
          for f in junoview.zip LICENSE NOTICE THIRD_PARTY_NOTICES.html; do
            cmp /tmp/web/$f /tmp/web2/$f
          done
